<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>RITM B — 02 underlit</title>
<link rel="stylesheet" href="brand-b.css">
<style>
/* ── B2 · bodies overhead, seen from below ───────────────────────────────────
   Camera: from UNDERNEATH, looking up. No frame in either style has done this.
   The consequence is the whole picture: we see the bodies' UNDERSIDES, which are
   dark, and the amber key rakes from above and behind them, so every object is
   drawn by its lit edges and by the warm light that gets through the glass one.
   Ground: obsidian, with a single soft amber wash where the key spills past the
   objects. No floor, no horizon: they hang over the viewer.
   Type: one word, bottom right, in paper white. The wordmark is top left.
   Dominant: obsidian with an amber edge. The cold spark appears once, on the
   figure that belongs to the brass rail. */
.frame { background: var(--obsidian); color: #f3ece1; }

.void {
  position: absolute; inset: 0;
  background:
    radial-gradient(46% 40% at 58% 2%, rgba(226,162,76,0.3), rgba(10,10,13,0) 62%),
    radial-gradient(70% 60% at 40% 110%, rgba(120,86,40,0.12), rgba(10,10,13,0) 70%),
    linear-gradient(184deg, #101017 0%, #0a0a0d 62%, #07070a 100%);
}

.stage { position: absolute; inset: 0; perspective: 1900px; perspective-origin: 52% 96%; }
/* the world tips AWAY from us: we are under it */
.world {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-style: preserve-3d;
  /* the first cut pushed the whole world into the bottom third and left the top
     two thirds an empty brown haze. The bodies belong in the middle band, with
     the type in the upper right void. */
  transform: rotateX(-58deg) rotateZ(13deg) translate(-30px, -60px);
}

.body { position: absolute; transform-style: preserve-3d; }
.body > .face, .body > .w1, .body > .w2 { position: absolute; }
/* at this camera the face we see is the UNDERSIDE, so it is the dark one */
.body > .face { inset: 0; }
.body > .w1 {
  left: 0; top: 100%; width: 100%; height: var(--h);
  transform-origin: top center; transform: rotateX(90deg);
}
.body > .w2 {
  left: 100%; top: 0; width: var(--h); height: 100%;
  transform-origin: left center; transform: rotateY(-90deg);
}

/* the brass rail, hanging nearest */
.rail { --h: 42px; }
.rail > .face {
  border-radius: 34px;
  background: linear-gradient(172deg, #4a3a1c, #2a2110 58%, #100c06);
  box-shadow: inset 0 0 0 2px rgba(226,190,120,0.22), inset 0 -2px 0 rgba(255,232,180,0.3);
}
.rail > .w1 {
  border-radius: 0 0 12px 12px;
  background: linear-gradient(180deg, #f4dda6, #c9a25c 46%, #7d5f2a);
  box-shadow: inset 0 1px 0 rgba(255,248,224,0.9);
}
.rail > .w2 { background: linear-gradient(180deg, #d8b878, #8a6a30); }

/* the smoked glass plate, hanging behind it, letting the key through */
.pane { --h: 26px; }
.pane > .face {
  border-radius: 20px;
  background: linear-gradient(172deg, rgba(120,110,96,0.34), rgba(36,32,28,0.5));
  backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255,236,200,0.28), inset 0 -2px 0 rgba(255,236,200,0.34);
}
.pane > .w1 { background: linear-gradient(180deg, rgba(255,238,202,0.5), rgba(150,120,70,0.3)); border-radius: 0 0 8px 8px; }
.pane > .w2 { background: linear-gradient(180deg, rgba(220,190,140,0.4), rgba(110,86,44,0.3)); }

/* the pin, small, highest and furthest, pure brass */
.pin { --h: 20px; }
.pin > .face {
  border-radius: 8px;
  background: linear-gradient(172deg, #3a2d15, #1a1409);
  box-shadow: inset 0 0 0 1.5px rgba(230,196,130,0.3), inset 0 -1px 0 rgba(255,236,180,0.4);
}
.pin > .w1 { background: linear-gradient(180deg, #f7e4b2, #b08a44); border-radius: 0 0 5px 5px; }
.pin > .w2 { background: linear-gradient(180deg, #d3ae6c, #7a5c2a); }

/* the key that gets THROUGH the glass, landing on nothing but the air */
/* the key that gets THROUGH the glass: tight and placed behind the pane, not a
   wide brown cloud over the whole upper frame. */
.spill {
  position: absolute; left: 700px; top: 300px; width: 520px; height: 300px;
  background: radial-gradient(closest-side, rgba(236,182,98,0.34), rgba(236,182,98,0) 72%);
  filter: blur(22px); mix-blend-mode: screen;
}

/* ── type ───────────────────────────────────────────────────────────────────*/
.wm { position: absolute; left: 104px; top: 88px; --wm: 1; }
.wm .name { color: #f2ece2; }
.tag {
  position: absolute; right: 104px; top: 94px;
  font-weight: 600; font-size: 15px; letter-spacing: 0.28em; color: rgba(238,226,206,0.4);
}
.line {
  /* up into the empty quadrant, clear of the bodies it used to print over */
  position: absolute; right: 104px; top: 188px; text-align: right;
  font-weight: 900; font-size: 132px; line-height: 1.14; letter-spacing: -0.035em;
  color: #f6f1e8;
  text-shadow: 0 -2px 0 rgba(255,236,200,0.28);
}
.line span {
  display: block; margin-top: 20px;
  font-weight: 500; font-size: 23px; letter-spacing: 0; color: rgba(236,224,204,0.55);
}
.read {
  position: absolute; left: 104px; bottom: 118px; text-align: left;
}
.read .n { font-size: 44px; color: #f7f2e9; }
.read .l {
  margin-top: 10px; display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: 17px; color: rgba(236,224,204,0.55);
}
</style>
</head>
<body>
<div class="frame">
  <div class="void"></div>

  <div class="stage">
    <div class="world">
      <div class="body rail" style="left:300px; top:520px; width:760px; height:120px; transform:translateZ(120px);">
        <div class="face"></div><div class="w1"></div><div class="w2"></div>
      </div>
      <div class="body pane" style="left:820px; top:300px; width:560px; height:330px; transform:translateZ(330px);">
        <div class="face"></div><div class="w1"></div><div class="w2"></div>
      </div>
      <div class="body pin" style="left:1320px; top:150px; width:190px; height:78px; transform:translateZ(520px);">
        <div class="face"></div><div class="w1"></div><div class="w2"></div>
      </div>
    </div>
  </div>

  <div class="spill"></div>

  <div class="wordmark wm">
    <span class="tile"><svg viewBox="0 0 16 16" fill="none">
      <path d="M3 11.5L6.2 8.3L8.4 10.5L13 5.9" stroke="#2a1c05" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 5.5H13V8.5" stroke="#2a1c05" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg></span>
    <span class="name">RITM</span>
  </div>
  <div class="tag">STYLE B · 02 UNDERLIT</div>

  <div class="read">
    <div class="n fig">62%</div>
    <div class="l"><span class="spark"></span> ما بقي لك من كل دينار</div>
  </div>

  <div class="line">
    القياس قبل الحكم
    <span>الرقم يُقاس، ثم يُحكم عليه. لا العكس.</span>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
