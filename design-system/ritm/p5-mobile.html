<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RITM · اللوحة على الهاتف</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="system.css"><link rel="stylesheet" href="docs.css"></head>
<body>
<!-- The responsive board describes what happens at 360. This is the thing itself:
     the same tokens and the same components, in a 390 plane, so the media queries
     actually run and the audit can measure them. -->
<div class="plane phone" style="display:flex;flex-direction:column">
  <header class="topbar" style="padding-inline:var(--s-4);gap:var(--s-2)">
    <span id="mark"></span>
    <nav class="crumbs" style="flex:1"><span aria-current="page">أغسطس 2026</span></nav>
    <button class="btn btn-tertiary btn-icon btn-sm" aria-label="الإشعارات">
      <svg class="i i-sm" viewBox="0 0 24 24"><path d="M18 16H6l1.5-2.5V10a4.5 4.5 0 0 1 9 0v3.5z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </button>
  </header>

  <div style="flex:1;min-height:0;overflow:auto;padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)">

    <section class="metric is-lead">
      <span class="headline"><span class="amount" style="font-size:var(--fs-h1)">1,775,800</span><span class="unit">د.ع.</span></span>
      <span class="name">ما بقي لك من أغسطس</span>
      <span class="compare"><span class="trend up">46.2%</span> مقابل يوليو</span>
    </section>

    <section class="card is-accent" style="padding:var(--s-3) var(--s-4)">
      <h3 style="font-size:var(--fs-body);font-weight:var(--fw-bold)">ثلاثة تحصيلات تأخّرت</h3>
      <p class="caption" style="margin-top:2px"><span class="num">1,892,820</span> دينار، أقدمها <span class="num">12</span> يوماً.</p>
      <button class="btn btn-primary btn-sm" style="margin-top:var(--s-3)">افتح التحصيلات</button>
    </section>

    <section class="card">
      <header><h3>أين ذهب الإيراد</h3>
        <span class="num spacer" style="font-size:var(--fs-small);color:var(--fg-3)">5,164,500</span></header>
      <div class="body" style="display:flex;flex-direction:column;gap:var(--s-3)">
        <div class="splitbar" style="height:var(--s-6)">
          <span style="width:34.4%;background:var(--series-1);color:var(--on-series-1)">34%</span>
          <span style="width:45.2%;background:var(--series-2);color:var(--on-series-2)">45%</span>
          <span style="width:14.9%;background:var(--series-3);color:var(--on-series-3)">15%</span>
          <span style="width:5.5%;background:var(--series-4)"></span>
        </div>
        <div id="key"></div>
      </div>
    </section>

    <!-- the table became rows: five columns cannot be read on a phone, and the
         system bans horizontal scrolling to hide that -->
    <section class="card">
      <header><h3>حصص المندوبين</h3><span class="badge badge-accent spacer">مجمَّد</span></header>
      <div id="reps"></div>
      <footer style="justify-content:space-between">
        <span class="small">المجموع</span>
        <span class="num" style="font-size:var(--fs-lead)">769,200</span></footer>
    </section>

    <section class="card">
      <header><h3>آخر الطلبات</h3></header>
      <div id="orders"></div>
    </section>
  </div>

  <nav class="tabbar">
    <a href="#" aria-current="page"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>العمليات</a>
    <a href="#"><svg class="i i-sm" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>التحصيل</a>
    <a href="#"><svg class="i i-sm" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/></svg>المندوبون</a>
    <a href="#"><svg class="i i-sm" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9h8M8 13h8"/></svg>التقارير</a>
  </nav>
</div>

<script type="module">
import { mark, MONTH, fmt } from "./shell.js";
document.getElementById("mark").outerHTML = mark(18);

const key = [["ما بقي لك", MONTH.net, "var(--series-1)"], ["كلفة الشراء", MONTH.cost, "var(--series-2)"],
             ["حصص المندوبين", MONTH.shares, "var(--series-3)"], ["التوصيل والمرتجع", MONTH.delivery, "var(--series-4)"]];
document.getElementById("key").innerHTML = key.map(([t, v, c]) => `
  <div style="display:flex;align-items:center;gap:var(--s-2);padding-block:var(--s-15);
       border-bottom:1px solid var(--line)">
    <i style="width:8px;height:8px;border-radius:2px;background:${c};flex:none"></i>
    <span style="flex:1;font-size:var(--fs-table)">${t}</span>
    <span class="num" style="font-size:var(--fs-table)">${fmt(v)}</span></div>`).join("");

document.getElementById("reps").innerHTML = MONTH.reps.map((r, i) => `
  <div class="datarow" style="cursor:default">
    <span class="avatar avatar-sm" style="background:var(--${r.key});color:var(--bg)">${r.name[0]}</span>
    <span class="tx"><b>${r.name}</b><span>${r.rule}</span></span>
    <span class="end"><span class="num" style="font-size:var(--fs-body);font-weight:var(--fw-bold)">${fmt(r.share)}</span></span>
  </div>`).join("");

const orders = [["ط-1048", "زيونة، بغداد", 278000, "في الطريق", "info"],
                ["ط-1047", "الكرادة", 241300, "مسوّى", "success"],
                ["ط-1045", "حي الجامعة", 121500, "بانتظار التحصيل", "warning"]];
document.getElementById("orders").innerHTML = orders.map(([id, dest, v, st, sk], i) => `
  <button class="datarow"${i === orders.length - 1 ? ' style="border-bottom:0"' : ""}>
    <span class="tx"><b>${id}</b><span>${dest}</span></span>
    <span class="end"><span class="num" style="display:block;font-size:var(--fs-body);font-weight:var(--fw-bold)">${fmt(v)}</span>
      <span class="badge badge-${sk}" style="height:18px;font-size:var(--fs-label);margin-top:2px">${st}</span></span>
  </button>`).join("");
</script>
</body></html>
