<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>رِتم — تقرير أغسطس</title><link rel="stylesheet" href="app.css"></head>
<body><div class="viewport"><div class="app" id="app"></div></div>
<script src="shell.js"></script>
<script>
/* S5 · the report. charts.csv, one chart per data shape:
   part-to-whole in an accessibility-first context → 100% stacked bar with direct
   labels, not a pie; ranking → horizontal bars sorted descending with direct
   values; trend → line with distinct line STYLES. Every chart is backed by the
   table under it, so no number exists only inside a picture. */
const money = n => new Intl.NumberFormat("en-US").format(n);
const SPLIT = [
  ["ما بقي لك",1775800,"var(--primary)"],
  ["كلفة الشراء",2334920,"#64748b"],
  ["حصص المندوبين",769200,"var(--secondary)"],
  ["التوصيل والمرتجع",284580,"var(--accent)"],
];
const T = SPLIT.reduce((a,s)=>a+s[1],0);
/* August only. The three shares sum to 769,200, which is exactly the rep slice
   of the split bar above — a report whose parts disagree with its own chart is
   the one defect a money product may never ship. */
const REPS = [
  ["ليث العبيدي","var(--rep-1)","736,000 د.ع.",331200,"مناصفة الربح الأولى · 45%",200000],
  ["سعد الجبوري","var(--rep-2)","996,000 د.ع.",298800,"نسبة الهامش الرفيع · 30%",250000],
  ["زينب الطائي","var(--rep-3)","116 قطعة",139200,"قسمة القطعة · 1,200 للقطعة",0],
  ["نور الحسن","var(--rep-4)","لا مبيعات",0,"مؤرشف",0],
].sort((a,b)=>b[3]-a[3]);
const RMAX = REPS[0][3];
const money0 = v => v ? money(v) : "0";
const CAT = [
  ["حافظات جلد",1842300,1229880,612420],
  ["شواحن سريعة",1498600,999700,498900],
  ["سماعات لاسلكية",1112400,740800,371600],
  ["أخرى",711200,418540,292880],
];

document.getElementById("app").innerHTML = shell("التقارير","تقرير أغسطس 2026",
  "أُقفل الشهر في 26 أغسطس · للقراءة فقط",
  `<button class="btn btn-outline btn-sm">${icon("cal","i-sm")}أغسطس 2026${icon("chevD","i-sm")}</button>
   <button class="btn btn-outline btn-sm">${icon("download","i-sm")}PDF</button>
   <button class="btn btn-primary btn-sm">${icon("download","i-sm")}تصدير CSV</button>`) + `
  <div class="content" style="display:flex;flex-direction:column;gap:var(--gap)">

    <div class="stats">
      <div class="stat"><div class="lab">الإيراد</div><div class="val">5,164,500</div>
        <div class="row"><span class="badge badge-success">${icon("up","i-sm")}12.4%</span><span>216 بيعة</span></div></div>
      <div class="stat is-primary"><div class="lab">صافي الربح</div><div class="val">1,775,800</div>
        <div class="row"><span class="badge badge-success">${icon("up","i-sm")}46.2%</span><span>هامش 34.4%</span></div></div>
      <div class="stat"><div class="lab">حصص المندوبين</div><div class="val">769,200</div>
        <div class="row"><span class="badge badge-neutral">14.9% من الإيراد</span><span>ثلاث قواعد</span></div></div>
      <div class="stat"><div class="lab">متوسط البيعة</div><div class="val">23,910</div>
        <div class="row"><span class="badge badge-danger">${icon("down","i-sm")}3.1%</span></div></div>
    </div>

    <section class="card">
      <div class="card-h"><h2>أين ذهب إيراد أغسطس</h2>
        <span class="sub">مجموع الأجزاء يساوي الإيراد بالضبط</span>
        <span class="spacer"></span><span class="badge badge-outline">5,164,500 د.ع.</span></div>
      <div class="card-b">
        <div class="splitbar" style="height:36px" role="img" aria-label="قسمة الإيراد على أربعة أجزاء">
          ${SPLIT.map(([k,v,c])=>{const p=v/T*100;
            return `<span style="width:${p.toFixed(2)}%;background:${c};font-size:var(--fs-xs)">${p>=8?p.toFixed(1)+"%":""}</span>`}).join("")}
        </div>
        <div class="legend" style="margin-top:12px">
          ${SPLIT.map(([k,v,c])=>`<span class="li"><span class="dot" style="background:${c}"></span>
            <b>${k}</b><span class="num">${money(v)}</span>
            <span>(${(v/T*100).toFixed(1)}%)</span></span>`).join("")}
        </div>
      </div>
    </section>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)">
      <section class="card">
        <div class="card-h"><h2>حصص المندوبين، مرتّبة</h2>
          <span class="sub">كل حصة بقاعدتها الخاصة</span></div>
        <div class="card-b">
          ${REPS.map(([n,c,basis,share,scheme,paid])=>`<div class="hbar" style="grid-template-columns:110px 1fr 96px;height:34px">
            <span style="font-size:var(--fs-sm)">${n}</span>
            <span class="track"><span class="fill" style="width:${RMAX?(share/RMAX*100).toFixed(1):0}%;background:${c}"></span></span>
            <span class="v">${money(share)}</span></div>`).join("")}
        </div>
        <div class="card-f"><span style="font-size:var(--fs-xs);color:var(--muted-fg)">
          الترتيب تنازلي بالحصة. لكلٍّ قاعدته، فالأساس ليس من جنس واحد: نسبة من الربح، أو عدد قطع.</span></div>
      </section>

      <section class="card">
        <div class="card-h"><h2>القسمة، بالتفصيل</h2></div>
        <div class="tablewrap"><table class="tbl">
          <thead><tr><th>المندوب</th><th>القاعدة</th><th class="n">أساس القسمة</th>
            <th class="n">حصته</th><th class="n">دُفع</th><th class="n">متبقٍ</th></tr></thead>
          <tbody>${REPS.map(([n,c,basis,share,scheme,paid])=>`<tr>
            <td><span class="who"><span class="av" style="background:${c}">${n.slice(0,1)}</span>${n}</span></td>
            <td style="color:var(--muted-fg);font-size:var(--fs-xs)">${scheme}</td>
            <td class="n" style="color:var(--muted-fg)">${basis}</td>
            <td class="n strong">${money0(share)}</td>
            <td class="n" style="color:var(--muted-fg)">${money0(paid)}</td>
            <td class="n" style="color:${share-paid?"var(--warning)":"var(--muted-fg)"}">${money0(share-paid)}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td colspan="2">المجموع</td><td class="n">لكلٍّ قاعدته</td>
            <td class="n">${money(REPS.reduce((a,r)=>a+r[3],0))}</td>
            <td class="n">${money(REPS.reduce((a,r)=>a+r[5],0))}</td>
            <td class="n">${money(REPS.reduce((a,r)=>a+r[3]-r[5],0))}</td></tr></tfoot>
        </table></div>
      </section>
    </div>

    <section class="card">
      <div class="card-h"><h2>الربح حسب الصنف</h2>
        <span class="spacer"></span>
        <div class="seg"><button aria-pressed="true">الصنف</button><button>المورّد</button><button>المنطقة</button></div></div>
      <div class="tablewrap"><table class="tbl">
        <thead><tr><th>الصنف</th><th class="n">الإيراد</th><th class="n">كلفة الشراء</th>
          <th class="n">صافي الربح</th><th class="n">الهامش</th><th style="width:180px">الحصة من الربح</th></tr></thead>
        <tbody>${CAT.map(([n,rev,cost,net])=>`<tr>
          <td class="strong">${n}</td>
          <td class="n">${money(rev)}</td>
          <td class="n" style="color:var(--muted-fg)">${money(cost)}</td>
          <td class="n pos strong">${money(net)}</td>
          <td class="n">${(net/rev*100).toFixed(1)}%</td>
          <td><span class="track" style="display:block;height:8px;background:var(--muted);border-radius:var(--r-sm);overflow:hidden">
            <span class="fill" style="display:block;height:100%;width:${(net/612420*100).toFixed(1)}%;background:var(--primary);border-radius:var(--r-sm)"></span></span></td>
        </tr>`).join("")}</tbody>
        <tfoot><tr><td>المجموع</td>
          <td class="n">${money(CAT.reduce((a,c)=>a+c[1],0))}</td>
          <td class="n">${money(CAT.reduce((a,c)=>a+c[2],0))}</td>
          <td class="n">${money(CAT.reduce((a,c)=>a+c[3],0))}</td>
          <td class="n">34.4%</td><td></td></tr></tfoot>
      </table></div>
      <div class="card-f">
        <span style="color:var(--muted-fg)">${icon("lock","i-sm")}</span>
        <p style="font-size:var(--fs-xs);color:var(--muted-fg)">
          الشهر مقفل. كل سعر شراء وكل قاعدة قسمة في هذا التقرير هي التي كانت ساريَة لحظة كل بيعة،
          وتغييرها اليوم لا يعيد كتابة هذا الجدول.</p>
      </div>
    </section>

  </div>`;
</script></body></html>
